<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FANUC 铣削编程助手（W版）</title>
<script>
/* 这一层刻意保持「永不变化」：只做入口转发，并原样带上 sharecode。
   原因：平台边缘缓存会按完整 URL 长期缓存，根路径一旦缓存旧副本，改内容也没用；
   把会变的应用放在 app.html，入口这层永远不用更新，缓存旧了也无害。 */
(function () {
  var q = location.search || '';
  if (!/app\.html/.test(location.pathname)) {
    location.replace('app.html' + q);
  }
})();
</script>
<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;gap:10px;
       font:14px/1.7 -apple-system,"Microsoft YaHei",sans-serif;color:#64748b;background:#f5f6f8}
  a{color:#185fa5}
</style>
</head>
<body>正在打开 FANUC 铣削编程助手…<a href="app.html">点此手动进入</a></body>
</html>
